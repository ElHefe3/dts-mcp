[package]
name = "document-templating-mcp"
version = "0.1.0"
edition = "2021"
description = "A persistent document template registry and renderer exposed over MCP"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
handlebars = "6"
rmcp = { version = "3.7", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lopdf = { version = "0.47", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
