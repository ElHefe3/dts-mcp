services:
  documents:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/document-templating-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCUMENT_TEMPLATING_MCP_HOST_PORT:-8093}:8080"
    environment:
      DOCUMENT_TEMPLATING_MCP_TOKEN: "${DOCUMENT_TEMPLATING_MCP_TOKEN:?set DOCUMENT_TEMPLATING_MCP_TOKEN in .env}"
    volumes:
      - document-data:/data
    read_only: true
    # Reaps Chromium helper processes.
    init: true
    tmpfs:
      # Chromium profile, shared memory and print output for each render.
      - /tmp:size=512m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

volumes:
  document-data:
