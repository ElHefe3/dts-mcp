services:
  documents:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/document-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCUMENT_MCP_HOST_PORT:-8093}:8080"
    environment:
      DOCUMENT_MCP_TOKEN: "${DOCUMENT_MCP_TOKEN:?set DOCUMENT_MCP_TOKEN in .env}"
    volumes:
      - document-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

volumes:
  document-data:
